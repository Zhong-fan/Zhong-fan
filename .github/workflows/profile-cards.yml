name: Update profile cards

on:
  schedule:
    # 每天 20:00 UTC = 次日 04:00 Asia/Shanghai
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-cards.yml

# 要把生成的 SVG 提交回本仓库，内置 token 需要写权限
permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 8
          THEME: github_dark
